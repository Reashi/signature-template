<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Email Signature</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0; padding: 0;">
    <table 
      cellpadding="0" 
      cellspacing="0" 
      border="0" 
      width="656" 
      height="199" 
      style="
        width: 656px !important; 
        height: 199px !important; 
        max-width: 656px; 
        max-height: 199px;
        background: #226EFF;
        border-radius: 12px;
        table-layout: fixed;
        border-collapse: collapse;
        position: relative;
      "
    >
      <tr>
        <!-- Sol Taraf - Logo ve İsim -->
        <td 
          width="270" 
          style="
            width: 270px !important;
            padding: 29px 0 29px 24px;
            vertical-align: top;
            text-align: center;
          "
        >
          <!-- Logo -->
          <div style="margin-top: 30px; margin-bottom: 20px; ">
            <img 
              src="https://www.enoca.com/wp-content/uploads/2019/02/enoca.png" 
              alt="Logo" 
              width="200" 
              height="32"
              style="
                border-radius: 5%; 
                display: block;
                margin: 0 auto;
                width: 200px !important;
                height: 32px !important;
                padding: 10px;
                background-color: #FFFFFF;
                max-width: 200px;
                max-height: 32px;
              " 
            />
          </div>
          
          <!-- İsim ve Meslek -->
          <div style="width: 200px; margin: 0 auto;">
            <div style="margin-bottom: 2px;">
              <span style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 600;
                font-size: 18px;
                line-height: 25px;
                color: #FFFFFF;
                text-align: center;
                display: block;
              ">Uğur Öztürk</span>
            </div>
            <div>
              <span style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 300;
                font-size: 14px;
                line-height: 19px;
                color: #FFFFFF;
                text-align: center;
                display: block;
              ">Frontend Developer</span>
            </div>
          </div>
        </td>
        
        <!-- Sağ Taraf - İletişim Bilgileri -->
        <td 
          width="386" 
          style="
            width: 386px !important;
            padding: 66px 0 0 0;
            vertical-align: top;
            position: relative;
          "
        >
          <!-- İletişim Bilgileri -->
          <div style="
            position: absolute;
            left: 43px;
            top: 66px;
            width: 200px;
          ">
            <!-- E-Mail -->
            <div style="
              display: flex;
              align-items: center;
              margin-bottom: 5px;
              height: 19px;
              width: 200px;
              white-space: nowrap;
            ">
              <div style="
                width: 14px;
                height: 14px;
                margin-right: 18px;
                position: relative;
                flex-shrink: 0;
              ">
                <!-- Mail Icon SVG -->
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M1.75 3.5L7 7.875L12.25 3.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                  <path d="M1.75 3.5H12.25V10.5C12.25 10.9142 11.9142 11.25 11.5 11.25H2.5C2.08579 11.25 1.75 10.9142 1.75 10.5V3.5Z" stroke="#FFFFFF" stroke-width="1.5"/>
                </svg>
              </div>
              <a href="mailto:ozturk-ugur@outlook.com" style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 600;
                font-size: 14px;
                line-height: 19px;
                color: #FFFFFF;
                overflow: hidden;
                text-overflow: ellipsis;
                text-decoration: none;
              ">ozturk-ugur@outlook.com</a>
            </div>
            
            <!-- WebPage -->
            <div style="
              display: flex;
              align-items: center;
              margin-bottom: 5px;
              height: 19px;
              width: 200px;
              white-space: nowrap;
            ">
              <div style="
                width: 14px;
                height: 14px;
                margin-right: 18px;
                position: relative;
                flex-shrink: 0;
              ">
                <!-- Link Icon SVG -->
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M5.83333 8.16667L8.16667 5.83333" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M7 3.5L8.16667 2.33333C9.08714 1.41286 10.5795 1.41286 11.5 2.33333C12.4205 3.2538 12.4205 4.74619 11.5 5.66667L10.3333 6.83333" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                  <path d="M7 10.5L5.83333 11.6667C4.91286 12.5871 3.42047 12.5871 2.5 11.6667C1.57953 10.7462 1.57953 9.2538 2.5 8.33333L3.66667 7.16667" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              </div>
              <span style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 600;
                font-size: 14px;
                line-height: 19px;
                color: #FFFFFF;
                overflow: hidden;
                text-overflow: ellipsis;
              ">https://reashi.github.io/</span>
            </div>
            
            <!-- Phone -->
            <div style="
              display: flex;
              align-items: center;
              height: 19px;
              width: 200px;
              white-space: nowrap;
            ">
              <div style="
                width: 14px;
                height: 14px;
                margin-right: 17px;
                position: relative;
                flex-shrink: 0;
              ">
                <!-- Phone Icon SVG -->
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M8.75 1.75H11.25C11.6642 1.75 12 2.08579 12 2.5V11.5C12 11.9142 11.6642 12.25 11.25 12.25H2.75C2.33579 12.25 2 11.9142 2 11.5V2.5C2 2.08579 2.33579 1.75 2.75 1.75H5.25" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
              <span style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 600;
                font-size: 14px;
                line-height: 19px;
                color: #FFFFFF;
                overflow: hidden;
                text-overflow: ellipsis;
              ">+90 555 555 55 55</span>
            </div>
          </div>
          
          <!-- Sosyal Medya İkonları -->
          <div style="
            position: absolute;
            right: 24px;
            bottom: 24px;
            width: 75px;
            height: 15px;
          ">
            <!-- Facebook -->
            <span style="
              display: inline-block;
              width: 15px;
              height: 15px;
              margin-right: 7px;
              vertical-align: top;
            ">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                <path d="M9.375 2.5H11.25V0H9.375C7.71875 0 6.375 1.34375 6.375 3V4.6875H4.6875V7.1875H6.375V15H8.875V7.1875H10.5625L11.25 4.6875H8.875V3C8.875 2.65625 9.15625 2.375 9.5 2.375H9.375V2.5Z" fill="#FFFFFF"/>
              </svg>
            </span>
            
            <!-- Twitter -->
            <span style="
              display: inline-block;
              width: 15px;
              height: 15px;
              margin-right: 7px;
              vertical-align: top;
            ">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                <path d="M14.375 2.8125C13.8438 3.0625 13.25 3.21875 12.6563 3.28125C13.2813 2.90625 13.75 2.3125 13.9688 1.59375C13.375 1.9375 12.7188 2.1875 12.0313 2.3125C11.4688 1.71875 10.6563 1.375 9.78125 1.375C8.09375 1.375 6.71875 2.75 6.71875 4.4375C6.71875 4.6875 6.75 4.9375 6.8125 5.15625C4.5 5.03125 2.4375 3.8125 1 2C0.71875 2.5625 0.5625 3.1875 0.5625 3.875C0.5625 5.15625 1.21875 6.28125 2.21875 6.9375C1.625 6.90625 1.0625 6.75 0.59375 6.5V6.53125C0.59375 8.03125 1.65625 9.28125 3.09375 9.5625C2.8125 9.65625 2.5 9.6875 2.1875 9.6875C1.96875 9.6875 1.75 9.65625 1.53125 9.625C1.96875 10.875 3.125 11.75 4.5 11.78125C3.4375 12.5938 2.125 13.0625 0.6875 13.0625C0.4375 13.0625 0.1875 13.0313 -0.0625 13C1.34375 13.8438 2.96875 14.3125 4.71875 14.3125C9.78125 14.3125 12.5625 9.75 12.5625 4.84375V4.4375C13.1875 4 13.7188 3.46875 14.1563 2.84375L14.375 2.8125Z" fill="#FFFFFF"/>
              </svg>
            </span>
            
            <!-- LinkedIn -->
            <span style="
              display: inline-block;
              width: 15px;
              height: 15px;
              vertical-align: top;
            ">
              <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
                <path d="M13.125 0H1.875C0.84375 0 0 0.84375 0 1.875V13.125C0 14.1563 0.84375 15 1.875 15H13.125C14.1563 15 15 14.1563 15 13.125V1.875C15 0.84375 14.1563 0 13.125 0ZM4.6875 12.5H2.5V5.625H4.6875V12.5ZM3.59375 4.6875C2.9375 4.6875 2.40625 4.15625 2.40625 3.5C2.40625 2.84375 2.9375 2.3125 3.59375 2.3125C4.25 2.3125 4.78125 2.84375 4.78125 3.5C4.78125 4.15625 4.25 4.6875 3.59375 4.6875ZM12.5 12.5H10.3125V9.15625C10.3125 8.34375 10.2813 7.28125 9.125 7.28125C7.96875 7.28125 7.78125 8.1875 7.78125 9.09375V12.5H5.59375V5.625H7.6875V6.59375H7.71875C8 6.0625 8.71875 5.5 9.75 5.5C11.9688 5.5 12.5 6.90625 12.5 8.75V12.5Z" fill="#FFFFFF"/>
              </svg>
            </span>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
