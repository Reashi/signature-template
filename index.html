<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Email Signature</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;600&display=swap" rel="stylesheet">
  </head>
  <body style="margin: 0; padding: 0;">
    <table 
      cellpadding="0" 
      cellspacing="0" 
      border="0" 
      width="656" 
      height="199" 
      style="
        width: 656px !important; 
        height: 199px !important; 
        max-width: 656px; 
        max-height: 199px;
        background: #226EFF;
        border-radius: 12px;
        table-layout: fixed;
        border-collapse: collapse;
        position: relative;
      "
    >
      <tr>
        <!-- Sol Taraf - Logo ve İsim -->
        <td 
          width="270" 
          style="
            width: 270px !important;
            padding: 29px 0 29px 24px;
            vertical-align: top;
            text-align: center;
          "
        >
          <!-- Logo -->
          <div style="
            margin-top: 30px; 
            margin-bottom: 20px;
            background-color: #FFFFFF;
            padding: 5px;
            border-radius: 8px;
            display: inline-block;
            width: 210px;
            text-align: center;
          ">
            <img 
              src="https://www.enoca.com/wp-content/uploads/2019/02/enoca.png" 
              alt="Logo" 
              width="200" 
              height="32"
              style="
                border-radius: 5%; 
                display: block;
                margin: 0 auto;
                width: 200px !important;
                height: 32px !important;
                max-width: 200px;
                max-height: 32px;
              " 
            />
          </div>
          
          <!-- İsim ve Meslek -->
          <div style="width: 200px; margin: 0 auto;">
            <div style="margin-bottom: 2px;">
              <span style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 600;
                font-size: 18px;
                line-height: 25px;
                color: #ffffff;
                text-align: center;
                display: block;
              ">Uğur Öztürk</span>
            </div>
            <div>
              <span style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 300;
                font-size: 14px;
                line-height: 19px;
                color: #ffffff;
                text-align: center;
                display: block;
              ">Full Stack Developer</span>
            </div>
          </div>
        </td>
        
        <!-- Sağ Taraf - İletişim Bilgileri -->
        <td 
          width="386" 
          style="
            width: 386px !important;
            padding: 66px 0 0 0;
            vertical-align: top;
            position: relative;
          "
        >
          <!-- İletişim Bilgileri -->
          <div style="
            position: absolute;
            left: 43px;
            top: 66px;
            width: 200px;
          ">
            <!-- E-Mail -->
            <div style="
              display: flex;
              align-items: center;
              margin-bottom: 5px;
              height: 19px;
              width: 200px;
              white-space: nowrap;
            ">

              <a href="mailto:ozturk-ugur@outlook.com" style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 600;
                font-size: 14px;
                line-height: 19px;
                color: #ffffff;
                overflow: hidden;
                text-overflow: ellipsis;
                text-decoration: none;
              ">ozturk-ugur@outlook.com</a>
            </div>
            
            <!-- WebPage -->
            <div style="
              display: flex;
              align-items: center;
              margin-bottom: 5px;
              height: 19px;
              width: 200px;
              white-space: nowrap;
            ">

              <a href="https://reashi.github.io/" style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 600;
                font-size: 14px;
                line-height: 19px;
                color: #ffffff;
                overflow: hidden;
                text-overflow: ellipsis;
                text-decoration: none;
              ">reashi.github.io/</a>
            </div>
            
            <!-- Phone -->
            <div style="
              display: flex;
              align-items: center;
              height: 19px;
              width: 200px;
              white-space: nowrap;
            ">

              <a href="tel:+905555555555" style="
                font-family: 'Nunito', Arial, sans-serif;
                font-weight: 600;
                font-size: 14px;
                line-height: 19px;
                color: #ffffff;
                overflow: hidden;
                text-overflow: ellipsis;
                text-decoration: none;
              ">+90 555 555 55 55</a>
            </div>
          </div>
          

        </td>
      </tr>
    </table>
  </body>
</html>
